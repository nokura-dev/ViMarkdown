name: Packages
on: [workflow_dispatch]
jobs:
  package:
    strategy:
      matrix:
        include:
          - {os: macos-latest, runtime: osx-arm64}
          - {os: windows-latest, runtime: win-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare D2
        shell: pwsh
        run: python scripts/prepare-d2.py ${{ matrix.runtime }}
      - name: Checks
        shell: pwsh
        run: dotnet run --project tests/ViMarkdown.Checks -p:UsedAvaloniaProducts= -p:UseSharedCompilation=false -- --all --d2
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: ViMarkdown-${{ matrix.runtime }}
          path: build/*.zip
